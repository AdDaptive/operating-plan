[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Set these in the Netlify dashboard (Site configuration -> Environment
# variables) rather than committing real values here:
#   DATABASE_URL     -- your Postgres connection string (Netlify Database,
#                        Neon, Supabase, Railway, etc.)
#   NEXTAUTH_SECRET  -- a long random string (e.g. `openssl rand -base64 32`)
#   NEXTAUTH_URL     -- your deployed site URL, e.g. https://your-site.netlify.app
